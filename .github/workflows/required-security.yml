# Required security scans for AwaedFintech repos.
#
# Lives in AwaedFintech/.github and is enforced org-wide via the
# "workflows" rule in ruleset 9871096. Status check names (= job names)
# referenced by the ruleset: gitleaks, trivy, osv-scanner.
#
# All tooling is free OSS (MIT / Apache-2.0). No GHAS, no paid actions.

name: Required Security Scans

on:
  pull_request: {}    # any PR, any target branch — ruleset decides where it's enforced
  push:
    branches: [main, develop, staging, test]
  workflow_call: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need base/before SHA reachable for the log range
      - name: Gitleaks scan (new commits only, OSS binary, MIT)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          # Scan ONLY commits introduced by this event — never full history.
          # PR: base..head    Push: before..after
          # Historical secrets are NOT this gate's concern (separate report-only scan handles that).
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          else
            RANGE="${PUSH_BEFORE}..${PUSH_AFTER}"
          fi
          echo "Scanning commit range: $RANGE"
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:latest \
            detect \
              --source=/repo \
              --log-opts="$RANGE" \
              --redact \
              --exit-code=1 \
              --verbose \
              --report-format=sarif \
              --report-path=/repo/gitleaks.sarif
      - name: Upload SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  trivy:
    name: trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (SCA + IaC + secrets)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          scanners: vuln,secret,misconfig
      - name: Upload SARIF
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy

  osv-scanner:
    name: osv-scanner
    permissions:
      actions: read           # required by the reusable workflow at v2.2.4
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.2.4
    with:
      scan-args: |-
        -r
        ./
